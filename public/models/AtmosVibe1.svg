<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 220" width="100%" height="auto">
  <defs>
    <!-- Background Canvas Palette -->
    <linearGradient id="opt3_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050B14" />
      <stop offset="50%" stop-color="#081426" />
      <stop offset="100%" stop-color="#040810" />
    </linearGradient>

    <!-- Card Fill -->
    <linearGradient id="opt3_card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(15, 29, 50, 0.9)" />
      <stop offset="100%" stop-color="rgba(8, 18, 34, 0.7)" />
    </linearGradient>

    <!-- Coastal Teal Gradient -->
    <linearGradient id="opt3_teal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#00E5FF" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <!-- Sunset Amber Gradient -->
    <linearGradient id="opt3_amber" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D97706" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#FEF08A" />
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="opt3_glowTeal" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="opt3_glowAmber" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Canvas Surface -->
  <rect width="680" height="220" rx="14" fill="url(#opt3_bg)" stroke="rgba(56, 189, 248, 0.18)" stroke-width="1.2" />

  <!-- ==================== MARK: SPATIAL RANGEFINDER ==================== -->
  <g transform="translate(42, 30)">
    <!-- Outer Datum / Measurement Ring -->
    <circle cx="80" cy="80" r="72" fill="rgba(2, 132, 199, 0.05)" stroke="rgba(56, 189, 248, 0.16)" stroke-width="1.2" />
    
    <!-- Precision Caliper Brackets -->
    <path d="M 52 38 L 32 38 L 32 122 L 52 122" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="square" />
    <path d="M 108 38 L 128 38 L 128 122 L 108 122" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="square" />
    
    <!-- Micrometer Caliper Ticks -->
    <line x1="22" y1="80" x2="32" y2="80" stroke="url(#opt3_teal)" stroke-width="2.4" />
    <line x1="128" y1="80" x2="138" y2="80" stroke="url(#opt3_teal)" stroke-width="2.4" />
    <line x1="32" y1="58" x2="38" y2="58" stroke="rgba(255,255,255,0.45)" stroke-width="1.2" />
    <line x1="32" y1="102" x2="38" y2="102" stroke="rgba(255,255,255,0.45)" stroke-width="1.2" />
    <line x1="122" y1="58" x2="128" y2="58" stroke="rgba(255,255,255,0.45)" stroke-width="1.2" />
    <line x1="122" y1="102" x2="128" y2="102" stroke="rgba(255,255,255,0.45)" stroke-width="1.2" />

    <!-- Optical Axis Alignment Lines -->
    <line x1="80" y1="28" x2="80" y2="46" stroke="url(#opt3_teal)" stroke-width="1.4" stroke-dasharray="3 3" />
    <line x1="80" y1="114" x2="80" y2="132" stroke="url(#opt3_teal)" stroke-width="1.4" stroke-dasharray="3 3" />

    <!-- Concentric Atmospheric Ring -->
    <circle cx="80" cy="80" r="36" fill="rgba(0, 229, 255, 0.06)" stroke="url(#opt3_teal)" stroke-width="1.4" />

    <!-- Radiant Sunset Amber Core -->
    <circle cx="80" cy="80" r="18" fill="url(#opt3_amber)" filter="url(#opt3_glowAmber)" opacity="0.4" />
    <circle cx="80" cy="80" r="9" fill="url(#opt3_amber)" />
    <circle cx="80" cy="80" r="3.2" fill="#FFFFFF" />
  </g>

  <!-- ==================== TYPOGRAPHY LOCKUP ==================== -->
  <g transform="translate(230, 96)">
    <!-- Wordmark -->
    <text font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="44" font-weight="300" letter-spacing="-0.8px" fill="#FFFFFF">Atmos<tspan fill="url(#opt3_teal)" font-weight="800">Vibe</tspan></text>
    
    <!-- Explainer Line -->
    <text y="38" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="600" letter-spacing="1.1px" fill="url(#opt3_amber)">Turn Local Atmosphere into Bookings</text>
  </g>
</svg>
