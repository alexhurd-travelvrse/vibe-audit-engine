<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 180" width="100%" height="100%">
  <defs>
    <!-- Specular Glass Rim -->
    <linearGradient id="ad_rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9" />
      <stop offset="35%" stop-color="#00E5FF" stop-opacity="0.55" />
      <stop offset="70%" stop-color="#38BDF8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.15" />
    </linearGradient>

    <!-- Translucent Frosted Glass Backplate -->
    <radialGradient id="ad_glassFill" cx="30%" cy="25%" r="75%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.22" />
      <stop offset="55%" stop-color="#0F172A" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#020617" stop-opacity="0.68" />
    </radialGradient>

    <!-- Index Bracket Gradient (Electric Cyan to Cobalt) -->
    <linearGradient id="ad_bracketGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <!-- Crosshair Telemetry Hairlines -->
    <linearGradient id="ad_hairlineGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#00E5FF" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0.2" />
    </linearGradient>

    <!-- Wordmark AMBI: Frosted Platinum -->
    <linearGradient id="ad_ambiGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>

    <!-- Wordmark DEX: Layered Electric Cyan -->
    <linearGradient id="ad_dexGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <!-- Cyan Glow Filter -->
    <filter id="ad_cyanGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- ==================== EMBLEM: THE INDEX RETICLE ==================== -->
  <g transform="translate(48, 16)">
    <!-- 1. Ambient Frosted Glass Disc -->
    <circle cx="74" cy="74" r="54" fill="url(#ad_glassFill)" stroke="url(#ad_rimGrad)" stroke-width="1.25" />

    <!-- 2. Concentric Calibration Reticle -->
    <circle cx="74" cy="74" r="42" fill="none" stroke="#FFFFFF" stroke-width="0.75" stroke-opacity="0.25" stroke-dasharray="2 3" />
    <circle cx="74" cy="74" r="28" fill="none" stroke="#38BDF8" stroke-width="0.75" stroke-opacity="0.35" />

    <!-- 3. Telemetry Axis Ticks -->
    <line x1="74" y1="24" x2="74" y2="34" stroke="url(#ad_hairlineGrad)" stroke-width="1.5" stroke-linecap="round" />
    <line x1="74" y1="114" x2="74" y2="124" stroke="url(#ad_hairlineGrad)" stroke-width="1.5" stroke-linecap="round" />
    <line x1="24" y1="74" x2="34" y2="74" stroke="url(#ad_hairlineGrad)" stroke-width="1.5" stroke-linecap="round" />
    <line x1="114" y1="74" x2="124" y2="74" stroke="url(#ad_hairlineGrad)" stroke-width="1.5" stroke-linecap="round" />

    <!-- 4. Indexing Calipers: Left Bracket [ -->
    <path
      d="M 44 48 L 32 48 L 32 100 L 44 100"
      fill="none"
      stroke="url(#ad_bracketGrad)"
      stroke-width="3"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <circle cx="32" cy="74" r="2" fill="#00E5FF" filter="url(#ad_cyanGlow)" />

    <!-- 5. Indexing Calipers: Right Bracket ] -->
    <path
      d="M 104 48 L 116 48 L 116 100 L 104 100"
      fill="none"
      stroke="url(#ad_bracketGrad)"
      stroke-width="3"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <circle cx="116" cy="74" r="2" fill="#00E5FF" filter="url(#ad_cyanGlow)" />

    <!-- 6. Central Aperture & Focal Sensor Node -->
    <circle cx="74" cy="74" r="11" fill="#0A101D" stroke="#00E5FF" stroke-width="1.25" stroke-opacity="0.8" />
    <circle cx="74" cy="74" r="4.5" fill="#00E5FF" filter="url(#ad_cyanGlow)" />
    <circle cx="74" cy="74" r="1.5" fill="#FFFFFF" />

    <!-- 7. Specular Lens Highlight -->
    <path d="M 42 42 Q 74 28 106 42 Q 74 36 42 42 Z" fill="#FFFFFF" opacity="0.22" />
  </g>

  <!-- ==================== WORDMARK ==================== -->
  <g transform="translate(205, 106)">
    <text font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="64" letter-spacing="-1.2px">
      <tspan fill="url(#ad_ambiGrad)" font-weight="300">AMBI</tspan><tspan fill="url(#ad_dexGrad)" font-weight="800">DEX</tspan>
    </text>

    <!-- Telemetry Status Beacon -->
    <circle cx="462" cy="-38" r="4" fill="#00E5FF" filter="url(#ad_cyanGlow)" />
  </g>
</svg>
