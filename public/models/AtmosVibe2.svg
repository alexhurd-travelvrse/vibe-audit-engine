<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 210" width="100%" height="auto">
  <defs>
    <!-- Background Canvas Gradient -->
    <linearGradient id="av_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050B14" />
      <stop offset="50%" stop-color="#081426" />
      <stop offset="100%" stop-color="#040810" />
    </linearGradient>

    <!-- White-to-Silver Gradient for Atmos -->
    <linearGradient id="av_whiteGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>

    <!-- Coastal Teal Gradient for Vibe -->
    <linearGradient id="av_teal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#00E5FF" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <!-- Sunset Amber Gradient for Tagline & Core -->
    <linearGradient id="av_amber" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D97706" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#FEF08A" />
    </linearGradient>

    <!-- Ambient Glow Filters -->
    <filter id="av_glowTeal" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="av_glowAmber" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Canvas Surface -->
  <rect width="740" height="210" rx="12" fill="url(#av_bg)" stroke="rgba(56, 189, 248, 0.16)" stroke-width="1" />

  <!-- ==================== SQUARE CALIPER MARK (Center Y = 95) ==================== -->
  <g transform="translate(48, 40)">
    <!-- 110x110 Architectural Square Frame (Y: 40 to 150) -->
    <rect x="0" y="0" width="110" height="110" rx="8" fill="rgba(2, 132, 199, 0.04)" stroke="rgba(56, 189, 248, 0.14)" stroke-width="1" />
    <circle cx="55" cy="55" r="46" fill="none" stroke="rgba(56, 189, 248, 0.08)" stroke-width="1" stroke-dasharray="2 3" />
    
    <!-- Precision Caliper Brackets [  ] -->
    <path d="M 38 26 L 22 26 L 22 84 L 38 84" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="square" />
    <path d="M 72 26 L 88 26 L 88 84 L 72 84" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="square" />
    
    <!-- Measurement Ticks -->
    <line x1="14" y1="55" x2="22" y2="55" stroke="url(#av_teal)" stroke-width="2.2" />
    <line x1="88" y1="55" x2="96" y2="55" stroke="url(#av_teal)" stroke-width="2.2" />
    <line x1="22" y1="40" x2="26" y2="40" stroke="rgba(255,255,255,0.4)" stroke-width="1" />
    <line x1="22" y1="70" x2="26" y2="70" stroke="rgba(255,255,255,0.4)" stroke-width="1" />
    <line x1="84" y1="40" x2="88" y2="40" stroke="rgba(255,255,255,0.4)" stroke-width="1" />
    <line x1="84" y1="70" x2="88" y2="70" stroke="rgba(255,255,255,0.4)" stroke-width="1" />

    <!-- Optical Alignment Axis Lines -->
    <line x1="55" y1="14" x2="55" y2="24" stroke="url(#av_teal)" stroke-width="1.2" stroke-dasharray="2 2" />
    <line x1="55" y1="86" x2="55" y2="96" stroke="url(#av_teal)" stroke-width="1.2" stroke-dasharray="2 2" />

    <!-- Concentric Ambient Ring -->
    <circle cx="55" cy="55" r="24" fill="rgba(0, 229, 255, 0.06)" stroke="url(#av_teal)" stroke-width="1.2" />

    <!-- Radiant Sunset Amber Core -->
    <circle cx="55" cy="55" r="12" fill="url(#av_amber)" filter="url(#av_glowAmber)" opacity="0.4" />
    <circle cx="55" cy="55" r="6" fill="url(#av_amber)" />
    <circle cx="55" cy="55" r="2.2" fill="#FFFFFF" />
  </g>

  <!-- ==================== TYPOGRAPHY STACK ==================== -->
  <g transform="translate(186, 0)">
    <!-- AtmosVibe: Optical center locked to Y = 95 (matching square midpoint) -->
    <text x="0" y="116" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Poppins, sans-serif" font-size="62" font-weight="300" letter-spacing="-1px" fill="url(#av_whiteGrad)">Atmos<tspan fill="url(#av_teal)" font-weight="900">Vibe</tspan></text>
    
    <!-- Explainer Line: Directly underneath AtmosVibe, left-aligned -->
    <text x="2" y="152" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="600" letter-spacing="1.1px" fill="url(#av_amber)">Turn Local Atmosphere into Bookings</text>
  </g>
</svg>
