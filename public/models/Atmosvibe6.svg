<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 90" width="460" height="90" fill="none">
  <defs>
    <!-- Heavy Outer Hexagon Gradient -->
    <linearGradient id="nav_hexBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="45%" stop-color="#00E5FF" />
      <stop offset="70%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <!-- Facet Fills -->
    <linearGradient id="nav_facetTeal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(0, 229, 255, 0.45)" />
      <stop offset="100%" stop-color="rgba(2, 132, 199, 0.2)" />
    </linearGradient>

    <linearGradient id="nav_facetWhite" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.55)" />
      <stop offset="100%" stop-color="rgba(226, 232, 240, 0.15)" />
    </linearGradient>

    <linearGradient id="nav_facetAmber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(245, 158, 11, 0.4)" />
      <stop offset="100%" stop-color="rgba(217, 119, 6, 0.15)" />
    </linearGradient>

    <linearGradient id="nav_facetDeep" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(2, 132, 199, 0.35)" />
      <stop offset="100%" stop-color="rgba(6, 11, 20, 0.6)" />
    </linearGradient>

    <!-- Enlarged Amber Core Radiant Gradient -->
    <radialGradient id="nav_amberCore" cx="45%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FFFBEB" />
      <stop offset="25%" stop-color="#FEF08A" />
      <stop offset="65%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </radialGradient>

    <!-- Typography Gradients -->
    <linearGradient id="nav_whiteGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>

    <linearGradient id="nav_tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="60%" stop-color="#00E5FF" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <linearGradient id="nav_tagAmber" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D97706" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#FEF08A" />
    </linearGradient>

    <!-- Core Glow Filter -->
    <filter id="nav_glowAmber" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- ==================== REFINED FACETED PRISM (MARK) ==================== -->
  <g transform="translate(0, 0)">
    <!-- 1. Simplified Primary Isometric Facets -->
    <!-- Facet: Top-Left (Cyan Receptive) -->
    <polygon points="42,11 12.5,28 24,58 42,26" fill="url(#nav_facetTeal)" stroke="rgba(0, 229, 255, 0.25)" stroke-width="0.8" stroke-linejoin="round" />
    
    <!-- Facet: Top-Right (Pure Ambient Light) -->
    <polygon points="42,11 71.5,28 60,58 42,26" fill="url(#nav_facetWhite)" stroke="rgba(255, 255, 255, 0.3)" stroke-width="0.8" stroke-linejoin="round" />
    
    <!-- Facet: Bottom-Left (Deep Spatial Structure) -->
    <polygon points="12.5,28 12.5,62 42,79 42,58 24,58" fill="url(#nav_facetDeep)" stroke="rgba(56, 189, 248, 0.2)" stroke-width="0.8" stroke-linejoin="round" />
    
    <!-- Facet: Bottom-Right (Warm Diurnal Refraction) -->
    <polygon points="71.5,28 71.5,62 42,79 42,58 60,58" fill="url(#nav_facetAmber)" stroke="rgba(245, 158, 11, 0.3)" stroke-width="0.8" stroke-linejoin="round" />

    <!-- 2. Clean Geometric Inner Prism Triangle -->
    <polygon points="42,26 60,58 24,58" fill="#060D1A" stroke="#FFFFFF" stroke-width="2" stroke-linejoin="round" />

    <!-- 3. Amber Focal Core -->
    <circle cx="42" cy="47" r="11" fill="url(#nav_amberCore)" filter="url(#nav_glowAmber)" opacity="0.45" />
    <circle cx="42" cy="47" r="8" fill="url(#nav_amberCore)" stroke="#FFFBEB" stroke-width="0.8" />

    <!-- 4. Heavy Outer Hexagon -->
    <polygon points="42,11 71.5,28 71.5,62 42,79 12.5,62 12.5,28" fill="none" stroke="url(#nav_hexBorder)" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round" />
  </g>

  <!-- ==================== TYPOGRAPHY LOCKUP ==================== -->
  <g transform="translate(90, 0)">
    <!-- Brand Wordmark -->
    <text x="0" y="47" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Poppins, sans-serif" font-size="39" font-weight="300" letter-spacing="-0.8px" fill="url(#nav_whiteGrad)">Atmos<tspan fill="url(#nav_tealGrad)" font-weight="900">Vibe</tspan></text>
    
    <!-- Baseline Tagline -->
    <text x="2" y="72" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14.5" font-weight="600" letter-spacing="0.8px" fill="url(#nav_tagAmber)">Turn Atmosphere into Bookings</text>
  </g>
</svg>
